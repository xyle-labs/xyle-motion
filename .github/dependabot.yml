version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Match the supported Node runtime; revisit with the engines field.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      remotion:
        patterns:
          - '@remotion/*'
          - remotion
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
