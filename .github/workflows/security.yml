name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm run security:setup
      - run: npm run security:check
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: node --test skills/xyle-motion/scripts/context.test.mjs

  installed-package:
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - name: Render from installed tarball
        env:
          XYLE_MOTION_CACHE: ${{ runner.temp }}/xyle-motion-cache
        run: |
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          node scripts/smoke.mjs "$RUNNER_TEMP/$tarball"
