name: Bug report
description: Report a reproducible problem with the installed CLI or studio.
body:
  - type: markdown
    attributes:
      value: Use a minimal synthetic video. Keep credentials, personal recordings, client material and machine-specific paths out of this public report. Report vulnerabilities through the private security link instead.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include explainer --version, node --version, operating system, and browser/FFmpeg versions when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command and the smallest synthetic YAML or steps that reproduce it. Can the bundled demo reproduce it?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include sanitized error output and which frame, scene or audio path is affected.
    validations:
      required: true
